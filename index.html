<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parakeet AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --glass-bg: rgba(8, 12, 20, 0.72);
    --glass-border: rgba(100, 220, 255, 0.18);
    --glass-blur: blur(28px) saturate(1.6);
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --text: #e2f4ff;
    --text-dim: rgba(180, 220, 255, 0.5);
    --danger: #ff4d6d;
    --glow: 0 0 24px rgba(0,229,255,0.18);
    --radius: 16px;
  }

  body {
    background: #040810;
    font-family: 'Syne', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridShift 20s linear infinite;
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 60% 40%, rgba(124,58,237,0.10) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 20% 80%, rgba(0,229,255,0.07) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }
  @keyframes gridShift { 100% { background-position: 48px 48px, 48px 48px; } }

  /* ── OVERLAY ── */
  #overlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(780px, 96vw);
    max-height: 90vh;
    display: flex; flex-direction: column;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: var(--radius);
    box-shadow: var(--glow), 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.07);
    z-index: 9999;
    transition: opacity 0.3s ease, transform 0.3s ease;
    overflow: hidden;
  }
  #overlay.hidden {
    opacity: 0; pointer-events: none;
    transform: translate(-50%, -52%) scale(0.97);
  }

  /* ── TITLEBAR ── */
  #titlebar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--glass-border);
    cursor: move; user-select: none; flex-shrink: 0;
  }
  .bird { font-size: 22px; filter: drop-shadow(0 0 6px var(--accent)); }
  #titlebar h1 {
    font-size: 15px; font-weight: 800;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); text-shadow: 0 0 12px rgba(0,229,255,0.4); flex: 1;
  }
  .kbd {
    font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim);
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px; padding: 3px 8px; letter-spacing: 0.05em;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent3); box-shadow: 0 0 8px var(--accent3);
    animation: pulse 2s ease-in-out infinite; flex-shrink: 0;
  }
  .dot.listening { background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: fast 0.6s ease-in-out infinite; }
  .dot.thinking  { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); animation: fast 0.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes fast  { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── CHAT ── */
  #chat {
    flex: 1; overflow-y: auto;
    padding: 16px 20px;
    display: flex; flex-direction: column; gap: 12px;
    min-height: 220px; max-height: 420px;
    scrollbar-width: thin; scrollbar-color: rgba(0,229,255,0.2) transparent;
  }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 4px; }

  .msg { display: flex; flex-direction: column; gap: 4px; animation: msgIn 0.25s cubic-bezier(.4,0,.2,1); }
  @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { align-items: flex-end; }
  .msg.ai   { align-items: flex-start; }

  .lbl {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); padding: 0 4px;
  }
  .msg.user .lbl { color: rgba(0,229,255,0.5); }
  .msg.ai   .lbl { color: rgba(124,58,237,0.7); }

  .bubble {
    max-width: 88%; padding: 10px 15px;
    border-radius: 12px; font-size: 14px; line-height: 1.65; word-break: break-word;
  }
  .msg.user .bubble {
    background: rgba(0,229,255,0.10);
    border: 1px solid rgba(0,229,255,0.18); border-bottom-right-radius: 4px;
  }
  .msg.ai .bubble {
    background: rgba(124,58,237,0.12);
    border: 1px solid rgba(124,58,237,0.2); border-bottom-left-radius: 4px;
    font-family: 'Space Mono', monospace; font-size: 13px;
  }

  /* Typing */
  .typing {
    display: flex; align-items: center; gap: 5px;
    padding: 10px 15px;
    background: rgba(124,58,237,0.12); border: 1px solid rgba(124,58,237,0.2);
    border-radius: 12px; border-bottom-left-radius: 4px; width: fit-content;
  }
  .tdot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent2); animation: bounce 1s ease-in-out infinite;
  }
  .tdot:nth-child(2){animation-delay:.15s} .tdot:nth-child(3){animation-delay:.30s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}

  /* Empty */
  .empty {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:10px; color:var(--text-dim); padding:24px; text-align:center;
  }
  .empty .icon { font-size:40px; opacity: 0.45; }
  .empty p { font-size:13px; line-height:1.6; }
  .empty code {
    font-family:'Space Mono',monospace; font-size:11px; color:rgba(0,229,255,0.4);
  }

  /* Markdown */
  .bubble code {
    background:rgba(0,0,0,0.3); border-radius:4px;
    padding:1px 5px; font-family:'Space Mono',monospace;
    font-size:12px; color:var(--accent);
  }
  .bubble pre {
    background:rgba(0,0,0,0.3); border-radius:8px;
    padding:10px; margin:6px 0; overflow-x:auto;
  }
  .bubble pre code { padding:0; background:none; }
  .bubble strong { color:var(--accent); font-weight:700; }
  .bubble em { color:rgba(200,230,255,0.8); }

  /* ── INPUT AREA ── */
  #inputArea {
    border-top: 1px solid var(--glass-border);
    padding: 14px 16px; display: flex;
    flex-direction: column; gap: 10px; flex-shrink: 0;
  }
  #toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chip {
    font-family:'Space Mono',monospace; font-size:10px;
    padding:4px 10px; border-radius:20px;
    background:rgba(255,255,255,0.04); border:1px solid var(--glass-border);
    color:var(--text-dim); cursor:pointer; transition:all 0.15s; letter-spacing:0.04em;
  }
  .chip:hover { background:rgba(0,229,255,0.08); border-color:rgba(0,229,255,0.3); color:var(--accent); }
  .chip.on { background:rgba(0,229,255,0.12); border-color:var(--accent); color:var(--accent); }
  #statusText {
    margin-left:auto; font-family:'Space Mono',monospace;
    font-size:10px; color:var(--text-dim); letter-spacing:0.04em;
  }

  #inputRow { display:flex; gap:8px; align-items:flex-end; }
  #qInput {
    flex:1; background:rgba(255,255,255,0.05);
    border:1px solid var(--glass-border); border-radius:10px;
    color:var(--text); font-family:'Syne',sans-serif;
    font-size:14px; padding:10px 14px; resize:none; outline:none;
    min-height:42px; max-height:120px;
    transition:border-color 0.2s, box-shadow 0.2s; line-height:1.5;
  }
  #qInput:focus { border-color:rgba(0,229,255,0.4); box-shadow:0 0 0 2px rgba(0,229,255,0.08); }
  #qInput::placeholder { color:var(--text-dim); }

  .btn {
    border:none; cursor:pointer; border-radius:10px;
    font-family:'Syne',sans-serif; font-weight:700;
    transition:all 0.18s; display:flex;
    align-items:center; justify-content:center; gap:6px; flex-shrink:0;
  }
  #micBtn {
    width:42px; height:42px; font-size:18px;
    background:rgba(255,77,109,0.10); border:1px solid rgba(255,77,109,0.25); color:var(--danger);
  }
  #micBtn:hover { background:rgba(255,77,109,0.20); }
  #micBtn.on {
    background:var(--danger); color:#fff;
    box-shadow:0 0 16px rgba(255,77,109,0.5);
    animation:micPulse 0.8s ease-in-out infinite;
  }
  @keyframes micPulse{0%,100%{box-shadow:0 0 16px rgba(255,77,109,0.5)}50%{box-shadow:0 0 28px rgba(255,77,109,0.8)}}

  #sendBtn {
    padding:0 18px; height:42px; font-size:13px; letter-spacing:0.06em;
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    color:#fff; box-shadow:0 4px 16px rgba(0,229,255,0.2);
  }
  #sendBtn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,229,255,0.3); }
  #sendBtn:disabled { opacity:0.4; cursor:not-allowed; }

  /* ── KEY PANEL ── */
  #keyPanel {
    position:absolute; inset:0; border-radius:var(--radius);
    background:rgba(8,12,20,0.92);
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:18px; padding:32px; z-index:10; transition:opacity 0.4s;
  }
  #keyPanel h2 {
    font-size:22px; font-weight:800; color:var(--accent);
    text-shadow:0 0 16px rgba(0,229,255,0.4); letter-spacing:0.08em;
  }
  #keyPanel p { font-size:13px; color:var(--text-dim); text-align:center; max-width:360px; line-height:1.6; }
  #keyPanel a { color:var(--accent); text-decoration:none; }
  #keyPanel a:hover { text-decoration:underline; }

  #apiKeyInput {
    width:100%; max-width:400px;
    background:rgba(255,255,255,0.05); border:1px solid var(--glass-border);
    border-radius:10px; color:var(--text); font-family:'Space Mono',monospace;
    font-size:13px; padding:12px 16px; outline:none;
    transition:border-color 0.2s; letter-spacing:0.04em;
  }
  #apiKeyInput:focus { border-color:rgba(0,229,255,0.4); }

  #saveKeyBtn {
    width:100%; max-width:400px; padding:12px;
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    border:none; border-radius:10px; color:#fff;
    font-family:'Syne',sans-serif; font-weight:800;
    font-size:14px; cursor:pointer; letter-spacing:0.08em; transition:all 0.18s;
  }
  #saveKeyBtn:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,229,255,0.25); }
  #keyErr { font-size:12px; color:var(--danger); font-family:'Space Mono',monospace; min-height:18px; }

  /* ── TOAST ── */
  #toast {
    position:absolute; bottom:16px; left:50%;
    transform:translateX(-50%) translateY(6px);
    background:rgba(8,12,20,0.95); border:1px solid var(--glass-border);
    border-radius:20px; font-family:'Space Mono',monospace;
    font-size:11px; color:var(--text); padding:5px 16px;
    opacity:0; transition:all 0.22s;
    pointer-events:none; white-space:nowrap; z-index:200;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="overlay">

  <!-- API KEY PANEL -->
  <div id="keyPanel">
    <div style="font-size:52px">🦜</div>
    <h2>PARAKEET AI</h2>
    <p>Enter your <strong>Groq API key</strong> to activate.<br>
    Get a free key at <a href="https://console.groq.com" target="_blank">console.groq.com</a></p>
    <input id="apiKeyInput" type="password" placeholder="gsk_••••••••••••••••••••••••••" autocomplete="off" spellcheck="false"/>
    <div id="keyErr"></div>
    <button id="saveKeyBtn">⚡ ACTIVATE PARAKEET</button>
    <p style="font-size:11px;margin-top:-4px">Key is saved in your browser for next time.</p>
  </div>

  <!-- TITLEBAR -->
  <div id="titlebar">
    <span class="bird">🦜</span>
    <h1>Parakeet AI</h1>
    <span class="kbd">Ctrl+Shift+H — Hide</span>
    <div class="dot" id="dot"></div>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div class="empty" id="empty">
      <div class="icon">🦜</div>
      <p>Ask anything — type or speak.<br>
      <code>Ctrl+Shift+H</code> hide &nbsp;·&nbsp; <code>Ctrl+Enter</code> send &nbsp;·&nbsp; <code>🎙️</code> voice</p>
    </div>
  </div>

  <!-- INPUT -->
  <div id="inputArea">
    <div id="toolbar">
      <span class="chip on" data-m="llama-3.3-70b-versatile">llama-3.3-70b</span>
      <span class="chip"    data-m="mixtral-8x7b-32768">mixtral-8x7b</span>
      <span class="chip"    data-m="gemma2-9b-it">gemma2-9b</span>
      <span id="statusText">READY</span>
    </div>
    <div id="inputRow">
      <textarea id="qInput" placeholder="Ask anything… (Ctrl+Enter to send)" rows="1"></textarea>
      <button class="btn" id="micBtn" title="Voice input">🎙️</button>
      <button class="btn" id="sendBtn">SEND ➤</button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
// ══════════════════════════════════════════════
//  PARAKEET AI — Vercel/Web Version
//  Groq API · Speech · Auto-send · Hide hotkey
// ══════════════════════════════════════════════

const STORAGE_KEY = 'parakeet_groq_key';

let groqKey = localStorage.getItem(STORAGE_KEY) || '';
let model   = 'llama-3.3-70b-versatile';
let history = [];
let busy    = false;
let recog   = null;
let listening = false;
let autoTimer = null;
const AUTO_DELAY = 1800;
let overlayVisible = true;

// Elements
const overlay     = document.getElementById('overlay');
const keyPanel    = document.getElementById('keyPanel');
const apiKeyInput = document.getElementById('apiKeyInput');
const saveKeyBtn  = document.getElementById('saveKeyBtn');
const keyErr      = document.getElementById('keyErr');
const chat        = document.getElementById('chat');
const empty       = document.getElementById('empty');
const qInput      = document.getElementById('qInput');
const micBtn      = document.getElementById('micBtn');
const sendBtn     = document.getElementById('sendBtn');
const dot         = document.getElementById('dot');
const statusText  = document.getElementById('statusText');
const toast       = document.getElementById('toast');

// Auto-load saved key
if (groqKey) {
  keyPanel.style.opacity = '0';
  setTimeout(() => keyPanel.style.display = 'none', 10);
  showToast('🦜 Welcome back!');
}

// ── KEY PANEL ──
saveKeyBtn.addEventListener('click', activateKey);
apiKeyInput.addEventListener('keydown', e => { if(e.key==='Enter') activateKey(); });

function activateKey() {
  const k = apiKeyInput.value.trim();
  if (!k.startsWith('gsk_') || k.length < 20) {
    keyErr.textContent = '✗ Invalid key — should start with gsk_'; return;
  }
  groqKey = k;
  localStorage.setItem(STORAGE_KEY, k);
  keyPanel.style.transition = 'opacity 0.4s';
  keyPanel.style.opacity = '0';
  setTimeout(() => keyPanel.style.display = 'none', 400);
  showToast('🦜 Parakeet AI activated!');
}

// ── MODEL CHIPS ──
document.querySelectorAll('.chip[data-m]').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-m]').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    model = c.dataset.m;
    showToast(`Model → ${model}`);
  });
});

// ── STATUS ──
function setStatus(s) {
  dot.className = 'dot' + (s==='listening'?' listening': s==='thinking'?' thinking':'');
  statusText.textContent = s==='listening' ? '● LISTENING…' : s==='thinking' ? '◌ THINKING…' : 'READY';
}

// ── TOAST ──
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}

// ── CHAT ──
function addMsg(role, text) {
  empty.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const lbl = document.createElement('div');
  lbl.className = 'lbl';
  lbl.textContent = role === 'user' ? 'YOU' : '🦜 PARAKEET';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = md(text);
  wrap.append(lbl, bub);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  empty.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'msg ai'; wrap.id = 'typing';
  const lbl = document.createElement('div');
  lbl.className = 'lbl'; lbl.textContent = '🦜 PARAKEET';
  const ind = document.createElement('div');
  ind.className = 'typing';
  ind.innerHTML = '<div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>';
  wrap.append(lbl, ind);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}
function rmTyping() { document.getElementById('typing')?.remove(); }

function md(t) {
  return t
    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g,        '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,  '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,      '<em>$1</em>')
    .replace(/\n/g,               '<br>');
}

// ── GROQ API ──
async function callGroq(msg) {
  if (!groqKey || busy) return;
  busy = true; setStatus('thinking'); sendBtn.disabled = true;
  history.push({ role: 'user', content: msg });
  addTyping();
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${groqKey}`
      },
      body: JSON.stringify({
        model,
        messages: [
          { role: 'system', content: 'You are Parakeet AI, a brilliant concise assistant. Be sharp and helpful. Use markdown for code.' },
          ...history
        ],
        max_tokens: 1024,
        temperature: 0.7
      })
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || '(empty)';
    history.push({ role: 'assistant', content: reply });
    rmTyping(); addMsg('ai', reply);
  } catch(err) {
    rmTyping(); addMsg('ai', `⚠️ Error: ${err.message}`);
    showToast(`✗ ${err.message}`); history.pop();
  } finally {
    busy = false; setStatus('ready'); sendBtn.disabled = false;
  }
}

// ── SEND ──
function handleSend() {
  const t = qInput.value.trim();
  if (!t || busy) return;
  if (!groqKey) { showToast('✗ Enter your Groq API key first'); return; }
  addMsg('user', t);
  qInput.value = ''; qInput.style.height = 'auto';
  callGroq(t);
}

sendBtn.addEventListener('click', handleSend);
qInput.addEventListener('input', () => {
  qInput.style.height = 'auto';
  qInput.style.height = Math.min(qInput.scrollHeight, 120) + 'px';
});

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown', e => {
  // Ctrl+Shift+H → hide/show
  if (e.ctrlKey && e.shiftKey && e.key === 'H') {
    e.preventDefault();
    overlayVisible = !overlayVisible;
    overlay.classList.toggle('hidden', !overlayVisible);
    if (overlayVisible) showToast('👁 Overlay shown');
  }
  // Ctrl+Enter → send
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault(); handleSend();
  }
  // Ctrl+Shift+C → clear
  if (e.ctrlKey && e.shiftKey && e.key === 'C') {
    e.preventDefault();
    chat.querySelectorAll('.msg').forEach(m => m.remove());
    history = []; empty.style.display = '';
    showToast('🗑 Chat cleared');
  }
  // Escape → clear input
  if (e.key === 'Escape' && qInput.value) {
    qInput.value = ''; qInput.style.height = 'auto';
  }
});

// ── DRAG ──
const titlebar = document.getElementById('titlebar');
let drag = null;
titlebar.addEventListener('mousedown', e => {
  const r = overlay.getBoundingClientRect();
  drag = { sx: e.clientX, sy: e.clientY, ol: r.left + r.width/2, ot: r.top + r.height/2 };
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  overlay.style.left = (drag.ol + e.clientX - drag.sx) + 'px';
  overlay.style.top  = (drag.ot + e.clientY - drag.sy) + 'px';
});
document.addEventListener('mouseup', () => { drag = null; document.body.style.userSelect = ''; });

// ── SPEECH RECOGNITION ──
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { micBtn.style.opacity = '0.35'; micBtn.title = 'Use Chrome/Edge for voice'; }

function initSpeech() {
  recog = new SR();
  recog.continuous = false; recog.interimResults = true; recog.lang = 'en-US';

  recog.onstart = () => {
    listening = true; micBtn.classList.add('on'); micBtn.textContent = '⏹️';
    setStatus('listening'); showToast('🎙️ Listening…');
    clearTimeout(autoTimer);
  };
  recog.onresult = e => {
    let final = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    qInput.value = (final || interim).trim();
    qInput.style.height = 'auto';
    qInput.style.height = Math.min(qInput.scrollHeight, 120) + 'px';
  };
  recog.onend = () => {
    listening = false; micBtn.classList.remove('on'); micBtn.textContent = '🎙️';
    setStatus('ready');
    if (qInput.value.trim()) {
      showToast(`⚡ Auto-sending in ${AUTO_DELAY/1000}s…`);
      autoTimer = setTimeout(handleSend, AUTO_DELAY);
    }
  };
  recog.onerror = e => {
    listening = false; micBtn.classList.remove('on'); micBtn.textContent = '🎙️';
    setStatus('ready');
    if (e.error !== 'aborted') showToast(`✗ Mic: ${e.error}`);
    clearTimeout(autoTimer);
  };
}

micBtn.addEventListener('click', () => {
  if (!SR) { showToast('✗ Use Chrome or Edge for voice'); return; }
  if (!recog) initSpeech();
  if (listening) { recog.stop(); clearTimeout(autoTimer); }
  else { clearTimeout(autoTimer); try { recog.start(); } catch(e) { initSpeech(); setTimeout(()=>recog.start(),80); } }
});
</script>
